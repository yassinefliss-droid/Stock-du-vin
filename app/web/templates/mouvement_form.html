{% extends "base.html" %}
{% block title %}Nouveau mouvement{% endblock %}
{% block content %}
<h1>Enregistrer un mouvement</h1>
<div class="carte etroite">
  {% if erreur %}<p class="erreur">{{ erreur }}</p>{% endif %}
  <form method="post">
    <label>Produit
      <select name="product_id" required>
        {% for x in lignes %}
        <option value="{{ x.produit.id }}" {{ 'selected' if x.produit.id == product_id }}>
          {{ x.produit.nom }} {{ x.produit.millesime or "NM" }} — stock {{ x.stock }}</option>
        {% endfor %}
      </select></label>
    <label>Type
      <select name="type">
        <option value="entree">Entrée</option>
        <option value="sortie">Sortie</option>
        <option value="ajustement">Ajustement d'inventaire (quantité signée, ex. -2)</option>
      </select></label>
    <label>Quantité <input name="quantite" type="number" required></label>
    <label>Date (vide = maintenant) <input name="date" type="datetime-local"></label>
    <label>Motif <input name="motif" maxlength="255"></label>
    <button>Enregistrer</button>
  </form>
</div>
{% endblock %}
