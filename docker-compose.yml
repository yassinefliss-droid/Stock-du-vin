services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: cave
      POSTGRES_PASSWORD: cave
      POSTGRES_DB: cave
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cave -d cave"]
      interval: 3s
      retries: 20

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: .env        # optionnel : clés LLM, SECRET_KEY…
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg2://cave:cave@db:5432/cave
    ports:
      - "8000:8000"

  streamlit:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    depends_on:
      - app
    environment:
      API_URL: http://app:8000
    ports:
      - "8501:8501"

volumes:
  pgdata:
